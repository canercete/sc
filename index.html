<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SC İletişim</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SC İletişim">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b1220">
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; color: #e2e8f0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  iframe { position: fixed; top: env(safe-area-inset-top, 0); left: 0; width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; background: #0b1220; }
  #acilis { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 2; background: #0b1220; transition: opacity .3s; }
  #acilis img { width: min(80vw, 380px); height: auto; }
  #acilis p { margin: 0; font-size: 14px; color: #94a3b8; }
  #acilis.gizli { opacity: 0; pointer-events: none; }
  #cubuk { width: min(70vw, 280px); height: 8px; border-radius: 99px; background: rgba(148, 163, 184, .18); overflow: hidden; opacity: 0; transition: opacity .3s; }
  #cubuk.acik { opacity: 1; }
  #cubuk i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #a8761d, #e9c46a, #fff1b8, #e9c46a, #a8761d); background-size: 200% 100%; animation: akis 1.4s linear infinite; transition: width .35s ease-out; box-shadow: 0 0 12px rgba(233, 196, 106, .5); }
  @keyframes akis { to { background-position: -200% 0; } }
  #yuzde { margin: 0; font-size: 12px; color: #64748b; min-height: 16px; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { #cubuk i { animation: none; transition: none; } }
  .kutu { max-width: 340px; padding: 0 20px; text-align: center; line-height: 1.5; font-size: 14px; }
</style>
</head>
<body>
<div id="acilis"><img src="logo-acilis.png" alt="SC İletişim · Mevsim İletişim"><p id="durum">Yükleniyor…</p><div id="cubuk"><i></i></div><p id="yuzde"></p></div>
<iframe id="uyg" title="SC İletişim" allow="camera; microphone; clipboard-read; clipboard-write; geolocation; fullscreen"></iframe>
<script>
  /* ↓↓↓ Yalnız bu satırı değiştirin: Apps Script › Dağıt › Dağıtımları yönet › Web uygulaması URL'si (…/exec ile biter) ↓↓↓ */
  var UYGULAMA = 'https://script.google.com/macros/s/AKfycbxyPXx6CrKS3xOXutpdBmO9SWlU5SCa4L9NleK6ECQBULd4T_bqPAjXz15oF0rzCe0awg/exec';
  /* ↑↑↑ */
  (function () {
    var ac = document.getElementById('acilis'), f = document.getElementById('uyg');
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(UYGULAMA)) {
      document.getElementById('durum').outerHTML = "<div class='kutu'><b>Kurulum tamamlanmadı.</b><br>index.html dosyasındaki <b>UYGULAMA</b> satırına web uygulamasının …/exec ile biten adresini yapıştırın.</div>";
      return;
    }
    /* V389 Anında açılış: program (Index.html) bu telefonda saklanır ve buradan anında açılır; Google'dan yalnız veri gelir.
       Yeni sürüm dağıtılınca program kendini arkada yeniler. Herhangi bir sorunda eski yöntemle (Google çerçevesi) açılır. */
    var durum = document.getElementById('durum'), cubuk = document.getElementById('cubuk'), yuzde = document.getElementById('yuzde');
    function cubukYaz(k, by) { cubuk.firstChild.style.width = Math.round(k * 100) + '%'; yuzde.textContent = '%' + Math.round(k * 100); }
    function eskiYol() {
      var hk = ''; try { hk = localStorage.getItem('sc_hk') || ''; } catch (e) {}
      window.addEventListener('message', function (ev) {
        if (!/^https:\/\/([\w-]+\.)*(googleusercontent\.com|script\.google\.com)$/.test(ev.origin) || !ev.data || typeof ev.data.sc_hk !== 'string') return;
        try { if (ev.data.sc_hk) localStorage.setItem('sc_hk', ev.data.sc_hk); else localStorage.removeItem('sc_hk'); } catch (e) {}
        try { ev.source.postMessage({ sc_ack: 1 }, ev.origin); } catch (e2) {}
      });
      f.onload = function () { setTimeout(function () { ac.className = 'gizli'; }, 400); };
      setTimeout(function () { ac.className = 'gizli'; }, 8000);
      f.src = UYGULAMA + (hk ? (UYGULAMA.indexOf('?') < 0 ? '?' : '&') + 'k=' + encodeURIComponent(hk) : '');
    }
    function hizliGoster(h) {   // kayıtlı kopyadan açılış: çubuk kısa sürede dolar, sonra açılır
      durum.textContent = 'Açılıyor…'; cubuk.className = 'acik';
      var t0 = performance.now(), SURE = 550;
      (function adim(t) { var k = Math.min(1, (t - t0) / SURE), e = 1 - Math.pow(1 - k, 2); cubuk.firstChild.style.transition = 'none'; cubukYaz(e, 0);
        if (k < 1) requestAnimationFrame(adim); else setTimeout(function () { goster(h); }, 40); })(t0);
    }
    function goster(h) {
      h = h.replace('/*VITRIN_MODU*/', function () { return 'window.DIS_MOD=1;window.EXEC_URL=' + JSON.stringify(UYGULAMA) + ';'; });
      document.open(); document.write(h); document.close();
    }
    /* V392: kopya iki yerde saklanır (IndexedDB + Cache); biri silinse diğerinden açılır. Tarayıcıdan kalıcı depolama izni istenir. */
    function idb() { return new Promise(function (ok, no) { try { var r = indexedDB.open('sc-kabuk', 1); r.onupgradeneeded = function () { r.result.createObjectStore('k'); }; r.onsuccess = function () { ok(r.result); }; r.onerror = function () { no(r.error); }; } catch (e) { no(e); } }); }
    function idbOku() { return idb().then(function (db) { return new Promise(function (ok) { var q = db.transaction('k', 'readonly').objectStore('k').get('kabuk'); q.onsuccess = function () { ok(q.result || null); }; q.onerror = function () { ok(null); }; }); }).catch(function () { return null; }); }
    function idbYaz(h) { return idb().then(function (db) { return new Promise(function (ok) { var tx = db.transaction('k', 'readwrite'); tx.objectStore('k').put(h, 'kabuk'); tx.oncomplete = function () { ok(true); }; tx.onerror = function () { ok(false); }; }); }).catch(function () { return false; }); }
    function cOku() { if (!window.caches) return Promise.resolve(null); return caches.open('sc-kabuk').then(function (c) { return c.match('kabuk'); }).then(function (r) { return r ? r.text() : null; }).catch(function () { return null; }); }
    function cYaz(h) { if (!window.caches) return Promise.resolve(false); return caches.open('sc-kabuk').then(function (c) { return c.put('kabuk', new Response(h, { headers: { 'Content-Type': 'text/plain;charset=utf-8' } })); }).then(function () { return true; }).catch(function () { return false; }); }
    function gecerli(h) { return !!h && h.indexOf('/*VITRIN_MODU*/') > -1 && h.indexOf('var SURUM_C') > -1; }
    function indir() {
      return fetch(UYGULAMA + (UYGULAMA.indexOf('?') < 0 ? '?' : '&') + 'raw=1', { cache: 'no-store' }).then(function (r) {
        if (!r.ok || !/text\/plain/.test(r.headers.get('content-type') || '')) throw new Error('eski sunucu');
        if (!r.body || !r.body.getReader || !window.TextDecoder) return r.text();
        var rd = r.body.getReader(), dc = new TextDecoder(), parca = '', by = 0, top = +(r.headers.get('content-length') || 0);
        if (!top) { try { top = +localStorage.getItem('sc_kabuk_boy') || 0; } catch (e) {} } if (!top) top = 1900000;   // Google boyut bildirmezse son indirilen boyut tahmin edilir
        cubuk.className = 'acik';
        return (function oku() { return rd.read().then(function (x) {
          if (x.done) { cubukYaz(1, by); try { localStorage.setItem('sc_kabuk_boy', String(by)); } catch (e) {} return parca + dc.decode(); }
          by += x.value.length; parca += dc.decode(x.value, { stream: true }); cubukYaz(Math.min(.97, by / top), by); return oku(); }); })();
      }).then(function (h) { if (!gecerli(h)) throw new Error('beklenmeyen'); return h; });
    }
    var hizliKapali = false; try { hizliKapali = localStorage.getItem('sc_hizli') === '0'; } catch (e) {}
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if (hizliKapali || !window.fetch || (!window.indexedDB && !window.caches)) { eskiYol(); }
    else {
      idbOku().then(function (h) {
        if (gecerli(h)) { hizliGoster(h); return; }
        return cOku().then(function (h2) {
          if (gecerli(h2)) { idbYaz(h2); hizliGoster(h2); return; }
          var once = false; try { once = !!localStorage.getItem('sc_kabuk_t'); if (once) localStorage.setItem('sc_kabuk_kayip', String((+localStorage.getItem('sc_kabuk_kayip') || 0) + 1)); } catch (e) {}
          durum.textContent = once ? 'Program yeniden hazırlanıyor…' : 'İlk açılış hazırlanıyor…';
          return indir().then(function (h3) {
            try { localStorage.setItem('sc_kabuk_t', String(Date.now())); } catch (e) {}
            idbYaz(h3); cYaz(h3);   // kayıt arkada sürer; açılış beklemez
            durum.textContent = 'Açılıyor…'; cubukYaz(1, 0);
            requestAnimationFrame(function () { setTimeout(function () { goster(h3); }, 0); });   // %100 ekrana yansısın, sonra hemen aç
          });
        });
      }).catch(function () { eskiYol(); });
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  })();
</script>
</body>
</html>
